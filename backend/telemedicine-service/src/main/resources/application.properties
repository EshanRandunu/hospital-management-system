# Telemedicine Service Configuration
spring.application.name=telemedicine-service

# Run this service on port 8088
server.port=8088

# MongoDB Configuration (using your Atlas cluster + telemedicine_db database)
spring.data.mongodb.uri=${MONGO_URI}

# External Service Endpoints (for internal service-to-service calls)
# URL of the Appointment Service ? change if deployed elsewhere or use environment variable
medilink.appointment-service.url=${APPOINTMENT_SERVICE_URL}

# Optional: Max file size if telemedicine handles uploads (e.g., prescriptions)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
