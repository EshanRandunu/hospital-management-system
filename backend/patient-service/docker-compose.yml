services:
  mongo-patient:
    image: mongo:7.0
    container_name: mongo-patient
    ports:
      - "27020:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: patient_db
    volumes:
      - mongo-patient-data:/data/db
    networks:
      - healthcare-network

  patient-service:
    build: .
    container_name: patient-service
    ports:
      - "8086:8086"
    depends_on:
      - mongo-patient
    environment:
      SPRING_DATA_MONGODB_URI: ${mongoDB url}
    networks:
      - healthcare-network

networks:
  healthcare-network:
    driver: bridge

volumes:
  mongo-patient-data:
